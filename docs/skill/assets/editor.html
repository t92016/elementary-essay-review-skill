<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>作文批註核對工作台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f1eb;color:#242b33;font:16px/1.6 "Microsoft JhengHei",sans-serif}header{background:#173e3b;color:white;padding:20px 28px}h1{margin:0;font-size:25px}main{display:grid;grid-template-columns:minmax(520px,1fr) 430px;gap:20px;padding:20px}.photo{overflow:auto;max-height:85vh;border:1px solid #ccc;background:white}.photo canvas{display:block;touch-action:none;cursor:crosshair}aside{background:white;padding:18px;border-radius:10px}button{padding:8px 12px;border:1px solid #9baca6;border-radius:5px;background:#edf5f2;cursor:pointer}button.primary{background:#173e3b;color:white}input,textarea,select{font:inherit;width:100%;padding:7px;border:1px solid #a8b4b0;border-radius:4px}input[type=checkbox]{width:auto}label{display:block;margin-top:8px}textarea{height:80px}#list{max-height:160px;overflow:auto;margin:12px 0}#list button{display:block;width:100%;text-align:left;margin:4px 0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.muted{color:#586961;font-size:14px}.error{color:#a51919;white-space:pre-wrap}#crop{max-width:100%;max-height:260px;border:1px solid #c0c8c2}#position{font-family:monospace}.selected{outline:2px solid #146d62}.warn{background:#fff1c9;padding:8px}@media(max-width:1000px){main{grid-template-columns:1fr}.photo{max-height:65vh}}
</style>
<header><h1>作文批註核對工作台</h1><div>在原圖拖曳選框 → 填原文與建議 → 核對三項 → 匯出 JSON</div></header>
<main><section><div class="toolbar"><button id="zoomOut">縮小</button><span id="zoomText"></span><button id="zoomIn">放大</button><button id="add">新增批註</button><button id="append">增加跨欄選框</button><button id="labelMode">移動近旁紅字</button><button id="targetMode">重選單字圈</button></div><div class="photo"><canvas id="photo"></canvas></div><p class="muted">原始像素座標，左上為 (0,0)。橘框字跡或判斷待確認，紅框已核對批註，灰框原有註記或不採用。照片與資料只在此頁面處理。</p></section>
<aside><div class="warn">這是人工核對版。OCR 候選與不清楚字跡不會自動算成錯字。</div><div class="toolbar"><button id="download" class="primary">匯出 JSON</button><button id="importBtn">匯入 JSON</button><input id="importFile" type="file" accept=".json" hidden></div><div id="message" role="status"></div><div id="list"></div><label>閱讀方向<select id="reading"><option value="vertical-right-to-left">直排 由右至左</option><option value="horizontal-left-to-right">橫排 由左至右</option></select></label><label>批註 ID<input id="aid" readonly></label><label>種類<select id="kind"><option value="uncertain">待確認字跡</option><option value="typo">確定錯字</option><option value="suggestion">修改／加句建議</option><option value="praise">佳句賞析</option><option value="existing">原圖已有註記</option></select></label><label>這段字的來源<select id="source_layer"><option value="unclassified">尚未分辨</option><option value="student">學生原文</option><option value="teacher-existing">老師原有批註</option></select></label><label>選框片段<select id="segment"></select></label><div id="position"></div><img id="crop" alt="選框原圖裁切，供核對"><label>此片段原文<input id="segmentText" placeholder="照原圖填寫，不先訂正"></label><label>完整引文（依片段順序）<textarea id="quote" readonly></textarea></label><label>建議正確字（錯字項目使用）<input id="replacement"></label><label>批註／修改建議<textarea id="note"></textarea></label><label>圖片短說明<textarea id="short_note"></textarea></label><label>好／需修改的理由<textarea id="reason"></textarea></label><label>修改示範<textarea id="example"></textarea></label><label>原文上下文<textarea id="context"></textarea></label><label>佳句線或修改線的位置<select id="mark_side"><option value="">預設</option><option value="left">左側 直排</option><option value="right">右側 直排</option><option value="above">上方 橫排</option><option value="below">下方 橫排</option></select></label><label>近旁紅字<input id="local_label"></label><label>單字圈對應原文哪個字<select id="targetCharacter"></select></label><img id="targetCrop" alt="單字圈原圖裁切" style="max-width:120px;max-height:120px;image-rendering:pixelated"><div id="extraPosition" class="muted"></div><label>狀態<select id="status"><option value="pending">待確認</option><option value="confirmed">已核對</option><option value="rejected">不採用</option></select></label><label><input id="textReviewed" type="checkbox"> 已核對原字與前後文</label><label><input id="positionReviewed" type="checkbox"> 已核對框線只涵蓋目標</label><label><input id="judgmentReviewed" type="checkbox"> 已核對錯字／建議判斷</label><label>核對者<input id="reviewer" placeholder="例如：老師姓名或 codex-visual-review"></label><div class="toolbar"><button id="save" class="primary">儲存此項</button><button id="remove">刪除此項</button></div><p class="muted">修改原文、框線、種類或建議後，三項核對會重設。匯出後，請讓 Codex 重新驗證並產生預覽 PNG。尚未儲存的欄位不會匯出。</p></aside></main>
<script>
'use strict';
const payload=__PAYLOAD__;
let project=structuredClone(payload.project),selected=-1,segIndex=0,scale=.48,start=null,appendMode=false,positionMode=null;
const $=id=>document.getElementById(id),canvas=$('photo'),ctx=canvas.getContext('2d'),im=new Image();
const statusLabels={pending:'待確認',confirmed:'已核對',rejected:'不採用'};
const kinds=['typo','uncertain','suggestion','praise','existing'];
function msg(s,error=false){$('message').textContent=s;$('message').className=error?'error':'muted'}
function check(p){
 if(p.version!==1||JSON.stringify(p.source)!==JSON.stringify(payload.project.source))throw Error('資料與原照片不一致，不能匯入。');
 if(!['vertical-right-to-left','horizontal-left-to-right'].includes(p.reading||'vertical-right-to-left'))throw Error('閱讀方向不支援');
 if(!Array.isArray(p.annotations))throw Error('annotations 格式錯誤');
 const ids=new Set();
 for(const a of p.annotations){
  if(typeof a.id!=='string'||!a.id||ids.has(a.id))throw Error('ID 重複或空白');ids.add(a.id);
  if(!kinds.includes(a.kind)||!['pending','confirmed','rejected'].includes(a.status)||!Array.isArray(a.segments)||!a.segments.length)throw Error('種類、狀態或片段格式錯誤');
  for(const s of a.segments){const b=s.box;if(!Array.isArray(b)||b.length!==4||!b.every(Number.isFinite)||b[0]<0||b[1]<0||b[2]<=0||b[3]<=0||b[0]+b[2]>im.naturalWidth||b[1]+b[3]>im.naturalHeight)throw Error('選框超出原圖');if(typeof s.text!=='string'||!s.text.trim()||!['manual','paddleocr','observed-crop'].includes(s.origin))throw Error('請填寫每個片段原文與座標來源');}
  if(a.mark_side&&(['praise','suggestion'].includes(a.kind))){const sides=(p.reading==='horizontal-left-to-right')?['above','below']:['left','right'];if(!sides.includes(a.mark_side))throw Error('線條位置與閱讀方向不符');}for(const seg of a.segments){if(seg.mark_side&&['praise','suggestion'].includes(a.kind)){const sides=p.reading==='horizontal-left-to-right'?['above','below']:['left','right'];if(!sides.includes(seg.mark_side))throw Error('片段線條位置與閱讀方向不符');}}
  if(a.label_xy&&(!Array.isArray(a.label_xy)||a.label_xy.length!==2||!a.label_xy.every(Number.isFinite)||a.label_xy[0]<0||a.label_xy[1]<0||a.label_xy[0]>=im.naturalWidth||a.label_xy[1]>=im.naturalHeight))throw Error('紅字位置超出原圖');
  if(a.target_box){const[x,y,w,h]=a.target_box;if(a.target_box.length!==4||!a.target_box.every(Number.isFinite)||x<0||y<0||w<=0||h<=0||x+w>im.naturalWidth||y+h>im.naturalHeight)throw Error('單字圈超出原圖');}
  if(a.source_layer&&!['student','teacher-existing','unclassified'].includes(a.source_layer))throw Error('字跡來源分類錯誤');if(a.status==='confirmed'&&['typo','praise','suggestion'].includes(a.kind)&&a.source_layer&&a.source_layer!=='student')throw Error('先確認這段是學生原文，才能批改');
  if(a.quote!==a.segments.map(s=>s.text).join('')||typeof a.note!=='string'||!a.note.trim())throw Error('引文與片段不一致或批註空白');
  if(a.status==='confirmed'&&a.target_box){const t=a.target_anchor,s=t&&a.segments[t.segment];if(!t||!Number.isInteger(t.segment)||!s||!Number.isInteger(t.start)||t.start<0||typeof t.text!=='string'||Array.from(t.text).length!==1||Array.from(s.text)[t.start]!==t.text||!['manual','paddleocr','observed-crop'].includes(t.origin))throw Error('單字圈必須連到片段中的實際原字');const[x,y,w,h]=a.target_box,[sx,sy,sw,sh]=s.box;if(x+w/2<sx||x+w/2>sx+sw||y+h/2<sy||y+h/2>sy+sh)throw Error('單字圈不在所連結原句內');}if(a.status==='confirmed'&&a.kind==='typo'&&!a.quote.includes('〔')&&!a.target_box&&(a.segments.length!==1||Array.from(a.quote).length!==1))throw Error('整句錯字必須另選並連結單字圈');
  if(a.status==='confirmed'){if(!a.review||!['text','position','judgment'].every(k=>a.review[k]===true)||typeof a.review.reviewer!=='string'||!a.review.reviewer.trim())throw Error('已核對項目必須完成三項核對及核對者');if(a.kind==='typo'&&(a.quote.includes('〔')||typeof a.replacement!=='string'||!a.replacement.trim()))throw Error('確定錯字需要可辨識原字及正確字');}
 }
}
function draw(){canvas.width=Math.round(im.naturalWidth*scale);canvas.height=Math.round(im.naturalHeight*scale);ctx.drawImage(im,0,0,canvas.width,canvas.height);ctx.save();ctx.scale(canvas.width/im.naturalWidth,canvas.height/im.naturalHeight);for(let i=0;i<project.annotations.length;i++){const a=project.annotations[i];ctx.strokeStyle=a.status==='rejected'||a.kind==='existing'?'#666':a.status==='pending'||a.kind==='uncertain'?'#cb7a06':'#c51624';ctx.lineWidth=i===selected?4:2;for(const s of a.segments){ctx.strokeRect(...s.box);}if(a.target_box){const[x,y,w,h]=a.target_box;ctx.beginPath();ctx.ellipse(x+w/2,y+h/2,w/2,h/2,0,0,Math.PI*2);ctx.stroke();}if(a.label_xy){ctx.fillStyle=ctx.strokeStyle;ctx.font=Math.max(12,Math.round(23*Math.min(1,im.naturalWidth/1703)))+'px Microsoft JhengHei';ctx.textBaseline='top';ctx.fillText(a.local_label||a.replacement||a.id,...a.label_xy);}}ctx.restore();$('zoomText').textContent=Math.round(scale*100)+'%';}
function list(){const el=$('list');el.replaceChildren();project.annotations.forEach((a,i)=>{const b=document.createElement('button');b.textContent=a.id+' · '+a.quote+' · '+statusLabels[a.status];if(i===selected)b.className='selected';b.onclick=()=>{positionMode=null;selected=i;segIndex=0;fill();draw()};el.append(b)});}
function clearChecks(){for(const k of ['textReviewed','positionReviewed','judgmentReviewed'])$(k).checked=false;$('status').value='pending';}
function fill(){$('reading').value=project.reading||'vertical-right-to-left';list();if(selected<0){$('aid').value='';$('crop').removeAttribute('src');return}const a=project.annotations[selected];$('aid').value=a.id;for(const k of ['mark_side','source_layer','kind','quote','replacement','note','short_note','reason','example','context','local_label','status'])$(k).value=a[k]||(k==='source_layer'?'unclassified':'');$('extraPosition').textContent='紅字位置：'+JSON.stringify(a.label_xy||null)+'；單字圈：'+JSON.stringify(a.target_box||null);const r=a.review||{};$('textReviewed').checked=!!r.text;$('positionReviewed').checked=!!r.position;$('judgmentReviewed').checked=!!r.judgment;$('reviewer').value=r.reviewer||'';const options=$('segment');options.replaceChildren();a.segments.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent='片段 '+(i+1)+'：'+s.text;options.add(o)});segIndex=Math.min(segIndex,a.segments.length-1);options.value=segIndex;fillSegment();}
function fillSegment(){if(selected<0)return;const s=project.annotations[selected].segments[segIndex];$('segmentText').value=s.text;$('position').textContent='[x,y,w,h] = '+JSON.stringify(s.box);const c=document.createElement('canvas');c.width=Math.ceil(s.box[2]);c.height=Math.ceil(s.box[3]);c.getContext('2d').drawImage(im,...s.box,0,0,c.width,c.height);$('crop').src=c.toDataURL('image/png');const selector=$('targetCharacter');selector.replaceChildren();const blank=document.createElement('option');blank.value='';blank.textContent='請選原字，再核對圈線';selector.add(blank);Array.from(s.text).forEach((ch,i)=>{const option=document.createElement('option');option.value=i;option.textContent='第 '+(i+1)+' 字：'+ch;selector.add(option);});const item=project.annotations[selected];if(item.target_box){const b=item.target_box,tc=document.createElement('canvas');tc.width=Math.ceil(b[2]);tc.height=Math.ceil(b[3]);tc.getContext('2d').drawImage(im,...b,0,0,tc.width,tc.height);$('targetCrop').src=tc.toDataURL('image/png');$('targetCrop').hidden=false;}else{$('targetCrop').removeAttribute('src');$('targetCrop').hidden=true;}const anchor=item.target_anchor;selector.value=anchor&&anchor.segment===segIndex&&Array.from(s.text)[anchor.start]===anchor.text?String(anchor.start):'';}
function resetModel(a){a.status='pending';a.review={text:false,position:false,judgment:false,reviewer:''};}
function point(e){const r=canvas.getBoundingClientRect();return [Math.min(im.naturalWidth,Math.max(0,(e.clientX-r.left)*im.naturalWidth/r.width)),Math.min(im.naturalHeight,Math.max(0,(e.clientY-r.top)*im.naturalHeight/r.height))]}
canvas.onpointerdown=e=>{if(positionMode==='label'){if(selected<0)return;project.annotations[selected].label_xy=point(e).map(Math.floor);resetModel(project.annotations[selected]);positionMode=null;fill();draw();msg('紅字位置已更新，請核對不遮字。');return}start=point(e);canvas.setPointerCapture(e.pointerId)};
canvas.onpointermove=e=>{if(!start)return;draw();const p=point(e),sx=canvas.width/im.naturalWidth,sy=canvas.height/im.naturalHeight;ctx.strokeStyle='#00695c';ctx.lineWidth=2;ctx.strokeRect(start[0]*sx,start[1]*sy,(p[0]-start[0])*sx,(p[1]-start[1])*sy)};
canvas.onpointercancel=()=>{start=null;draw()};
canvas.onpointerup=e=>{if(!start)return;const p=point(e);const box=[Math.floor(Math.min(start[0],p[0])),Math.floor(Math.min(start[1],p[1])),0,0];box[2]=Math.ceil(Math.max(start[0],p[0]))-box[0];box[3]=Math.ceil(Math.max(start[1],p[1]))-box[1];start=null;if(box[2]<3||box[3]<3){draw();return}if(positionMode==='target'&&selected>=0){project.annotations[selected].target_box=box;resetModel(project.annotations[selected]);positionMode=null;fill();draw();msg('單字圈已更新，請核對原字與位置。');return}if(selected<0){const id='A'+Date.now().toString(36);project.annotations.push({id,kind:'uncertain',status:'pending',segments:[{box,text:'',origin:'manual'}],quote:'',replacement:'',note:'',review:{}});selected=project.annotations.length-1;segIndex=0;}else{const a=project.annotations[selected];if(appendMode){a.segments.push({box,text:'',origin:'manual'});segIndex=a.segments.length-1}else{a.segments[segIndex].box=box;a.segments[segIndex].origin='manual'}resetModel(a)}appendMode=false;fill();draw();msg('已更新選框，請填原文並重新核對。')};
$('labelMode').onclick=()=>{if(selected<0)return msg('請先選批註。',true);positionMode='label';msg('先儲存文字修改，再在原圖留白點選紅字位置。')};
$('targetMode').onclick=()=>{if(selected<0)return msg('請先選批註。',true);positionMode='target';msg('先儲存文字修改，再拖曳重選單字圈；不推算字的位置。')};
$('add').onclick=()=>{positionMode=null;selected=-1;segIndex=0;appendMode=false;fill();draw();msg('請在原圖拖曳選框建立批註。')};
$('append').onclick=()=>{if(selected<0)return msg('請先選一項批註。',true);appendMode=true;msg('請在下一欄拖曳新增片段，原片段會保留。')};
$('targetCharacter').onchange=()=>{if(selected<0)return;const a=project.annotations[selected];const index=Number($('targetCharacter').value);if($('targetCharacter').value===''){delete a.target_anchor;}else{a.target_anchor={segment:segIndex,start:index,text:Array.from(a.segments[segIndex].text)[index],origin:'manual'};}resetModel(a);fill();draw();msg('原字連結已更新，請核對圈線是否對應這個字。');};
$('reading').onchange=()=>{project.reading=$('reading').value;for(const a of project.annotations){delete a.mark_side;resetModel(a);}fill();draw();msg('閱讀方向已變更，所有批註須重新核對。');};
$('segment').onchange=()=>{segIndex=Number($('segment').value);fillSegment()};
for(const k of ['mark_side','source_layer','kind','replacement','note','short_note','reason','example','context','local_label','segmentText'])$(k).addEventListener('input',clearChecks);
for(const k of ['kind','replacement'])$(k).addEventListener('input',()=>{if($('kind').value==='typo')$('local_label').value=$('replacement').value;});
$('save').onclick=()=>{if(selected<0)return msg('請先選框。',true);const old=structuredClone(project.annotations[selected]);const a=project.annotations[selected];a.segments[segIndex].text=$('segmentText').value;a.quote=a.segments.map(s=>s.text).join('');for(const k of ['mark_side','source_layer','kind','replacement','note','short_note','reason','example','context','local_label','status'])a[k]=$(k).value;if(!a.mark_side)delete a.mark_side;if(a.kind==='typo'){a.local_label=a.replacement;$('local_label').value=a.replacement;}a.review={text:$('textReviewed').checked,position:$('positionReviewed').checked,judgment:$('judgmentReviewed').checked,reviewer:$('reviewer').value};try{check({...project,annotations:[a]});fill();draw();msg('此項已儲存。')}catch(e){project.annotations[selected]=old;msg(e.message,true)}};
$('remove').onclick=()=>{if(selected<0)return;project.annotations.splice(selected,1);selected=-1;fill();draw();msg('已刪除，可重新匯入先前 JSON 還原。')};
$('download').onclick=()=>{try{check(project);const blob=new Blob([JSON.stringify(project,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='reviewed-project.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);msg('已匯出目前儲存的資料。')}catch(e){msg(e.message,true)}};
$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{try{const p=JSON.parse(await e.target.files[0].text());check(p);project=p;selected=project.annotations.length?0:-1;segIndex=0;fill();draw();msg('已匯入。')}catch(e){msg(e.message,true)}finally{e.target.value=''}};
$('zoomIn').onclick=()=>{scale=Math.min(2,scale+.15);draw()};$('zoomOut').onclick=()=>{scale=Math.max(.15,scale-.15);draw()};
im.onload=()=>{if(im.naturalWidth!==project.source.width||im.naturalHeight!==project.source.height)return msg('圖片尺寸與原始座標不符。',true);selected=project.annotations.length?0:-1;fill();draw()};im.src=payload.image;
</script></html>
